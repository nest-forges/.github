name: 🛡️ Fetch secrets from Infisical
description: Fetch secrets from Infisical (/global) and inject them into the environment.

inputs:
  identity-id:
    required: false
    default: 1f1770ba-fa85-4158-b176-c0951bbae9ac
    description: Infisical machine identity ID
  project-slug:
    required: false
    default: nest-forges-e-re-v
    description: Infisical project slug
  secret-path:
    required: true
    description: Infisical secret path (e.g. "/global" or "/myapp")

runs:
  using: composite
  steps:
    - name: Fetch secrets from Infisical (${{ inputs.secret-path }})
      uses: Infisical/secrets-action@v1.0.18
      with:
        method: oidc
        identity-id: ${{ inputs.identity-id }}
        project-slug: ${{ inputs.project-slug }}
        env-slug: prod
        secret-path: ${{ inputs.secret-path }}
        domain: https://app.infisical.com
