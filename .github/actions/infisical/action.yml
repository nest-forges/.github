name: 🛡️ Fetch secrets from Infisical
description: Fetch secrets from Infisical and inject them into the environment.

inputs:
  secret-path:
    required: false
    default: ${{ vars.INFISICAL_GLOBAL_PATH }}
    description: Infisical secret path (e.g. "/global" or "/myapp")

runs:
  using: composite
  steps:
    - name: Fetch secrets from Infisical (${{ inputs.secret-path }})
      uses: Infisical/secrets-action@v1.0.18
      with:
        method: ${{ vars.INFISICAL_METHOD }}
        identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
        project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
        env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
        secret-path: ${{ inputs.secret-path }}
        domain: ${{ vars.INFISICAL_DOMAIN }}
