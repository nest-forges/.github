name: 📧 Notify reusable

on:
  workflow_call:
    inputs:
      ref-name:
        required: true
        type: string
        description: Git ref name (e.g. tag or branch) that was deployed
      website:
        required: true
        type: string
        description: URL of the deployed website to include in the notification email
      deploy-result:
        required: false
        type: string
        default: 'skipped'
        description: Result of the deploy job (success, failure, skipped, cancelled)
      remote-result:
        required: false
        type: string
        default: 'skipped'
        description: Result of the remote/e2e job (success, failure, skipped, cancelled)

jobs:
  notify:
    name: 📧 Notify after deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Fetch secrets from Infisical (/global)
        uses: nest-forges/.github/.github/actions/infisical@main
        with:
          secret-path: "/global"

      - name: 🛡️ Validate required secrets
        run: |
          if [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "❌  Required secrets are missing."
            echo "    Make sure all of the following are"
            echo "    present in Infisical and exported:"
            echo "  ✗ GMAIL_APP_PASSWORD"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi
          echo "✅ All required secrets are present."

      - name: 📋 Build notification
        id: check
        run: |
          DEPLOY_RESULT="${{ inputs.deploy-result }}"
          REMOTE_RESULT="${{ inputs.remote-result }}"
          REF="${{ inputs.ref-name }}"
          WEBSITE="${{ inputs.website }}"

          if [ "$DEPLOY_RESULT" != "success" ]; then
            echo "subject=❌ Deploy $REF fehlgeschlagen" >> "$GITHUB_OUTPUT"
            echo "body=Der Deploy von $REF ist fehlgeschlagen (Job-Status: ${DEPLOY_RESULT}). Die E2E-Tests wurden nicht ausgeführt. Bitte die Deploy-Logs in GitHub Actions prüfen." >> "$GITHUB_OUTPUT"
          elif [ "$REMOTE_RESULT" != "success" ]; then
            echo "subject=❌ E2E-Tests $REF fehlgeschlagen" >> "$GITHUB_OUTPUT"
            echo "body=Der Deploy von $REF war erfolgreich, aber die E2E-Tests sind fehlgeschlagen (Job-Status: ${REMOTE_RESULT}). Bitte die Test-Logs in GitHub Actions prüfen." >> "$GITHUB_OUTPUT"
          else
            echo "subject=✅ Deploy $REF erfolgreich" >> "$GITHUB_OUTPUT"
            echo "body=Der Deploy von $REF war erfolgreich und alle E2E-Tests haben bestanden. Die Website ist erreichbar: $WEBSITE" >> "$GITHUB_OUTPUT"
          fi

      - name: 📧 Send notification email
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: mihail.boehm@googlemail.com
          password: ${{ env.GMAIL_APP_PASSWORD }}
          to: mihail.boehm@googlemail.com
          from: GitHub Actions <mihail.boehm@googlemail.com>
          subject: ${{ steps.check.outputs.subject }}
          body: ${{ steps.check.outputs.body }}
