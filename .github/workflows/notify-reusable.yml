name: 📧 Notify reusable

on:
  workflow_call:
    inputs:
      ref-name:
        required: true
        type: string
        description: Git ref name (e.g. tag or branch) that was deployed
      website:
        required: true
        type: string
        description: URL of the deployed website to include in the notification email
    secrets:
      GMAIL_APP_PASSWORD:
        required: true
        description: Gmail app password used to send the notification email via SMTP

jobs:
  notify:
    name: 📧 Notify after deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check website availability
        id: check
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 "${{ inputs.website }}")
          echo "status=$HTTP_STATUS" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send success email
        if: steps.check.outputs.ok == 'true'
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: mihail.boehm@googlemail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: mihail.boehm@googlemail.com
          from: GitHub Actions <mihail.boehm@googlemail.com>
          subject: "✅ Deploy ${{ inputs.ref-name }} erfolgreich"
          body: |
            Der Deploy von ${{ inputs.ref-name }} war erfolgreich.
            Die Website ${{ inputs.website }} ist erreichbar (HTTP ${{ steps.check.outputs.status }}).

      - name: Send failure email
        if: steps.check.outputs.ok == 'false'
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: mihail.boehm@googlemail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: mihail.boehm@googlemail.com
          from: GitHub Actions <mihail.boehm@googlemail.com>
          subject: "⚠️ Deploy ${{ inputs.ref-name }} – Website nicht erreichbar"
          body: |
            Der Deploy von ${{ inputs.ref-name }} wurde abgeschlossen, aber die Website
            ${{ inputs.website }} antwortet mit HTTP ${{ steps.check.outputs.status }}.
            Bitte manuell prüfen.
