name: 📧 Notify reusable

on:
  workflow_call:
    inputs:
      ref-name:
        required: true
        type: string
        description: Git ref name (e.g. tag or branch) that was deployed
      website:
        required: true
        type: string
        description: URL of the deployed website to include in the notification email

jobs:
  notify:
    name: 📧 Notify after deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Fetch secrets from Infisical (/global)
        uses: nest-forges/.github/.github/actions/infisical@main
        with:
          secret-path: "/global"

      - name: 🛡️ Validate required secrets
        run: |
          if [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "❌  Required secrets are missing."
            echo "    Make sure all of the following are"
            echo "    present in Infisical and exported:"
            echo "  ✗ GMAIL_APP_PASSWORD"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi
          echo "✅ All required secrets are present."

      - name: 🌐 Check website availability
        id: check
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 "${{ inputs.website }}")
          echo "status=$HTTP_STATUS" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "ok=true"  >> "$GITHUB_OUTPUT"
            echo "subject=✅ Deploy ${{ inputs.ref-name }} erfolgreich" >> "$GITHUB_OUTPUT"
            echo "body=Der Deploy von ${{ inputs.ref-name }} war erfolgreich. Die Website ${{ inputs.website }} ist erreichbar (HTTP ${HTTP_STATUS})." >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "subject=⚠️ Deploy ${{ inputs.ref-name }} – Website nicht erreichbar" >> "$GITHUB_OUTPUT"
            echo "body=Der Deploy von ${{ inputs.ref-name }} wurde abgeschlossen, aber die Website ${{ inputs.website }} antwortet mit HTTP ${HTTP_STATUS}. Bitte manuell prüfen." >> "$GITHUB_OUTPUT"
          fi

      - name: 📧 Send notification email
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: mihail.boehm@googlemail.com
          password: ${{ env.GMAIL_APP_PASSWORD }}
          to: mihail.boehm@googlemail.com
          from: GitHub Actions <mihail.boehm@googlemail.com>
          subject: ${{ steps.check.outputs.subject }}
          body: ${{ steps.check.outputs.body }}
