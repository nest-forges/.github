name: 🎭 E2E Tests (Reusable)

on:
  workflow_call:
    inputs:
      php-version-primary:
        description: 'Primary PHP version'
        type: string
        required: true

jobs:
  e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: 🧪 Run E2E tests
        uses: nest-forges/.github/.github/actions/e2e@main
        with:
          php-version: ${{ inputs.php-version-primary }}
          e2e-command: composer tests:e2e:remote
