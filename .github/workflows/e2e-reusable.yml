name: 🎭 E2E Tests (Reusable)

on:
  workflow_call:
    inputs:
      base-url:
        required: true
        type: string
        description: URL of the deployed website to run Playwright tests against
      node-version:
        required: false
        type: string
        default: "24"
        description: Node.js version to use (default "24")
      e2e-command:
        required: true
        type: string
        description: npm script to run for remote E2E tests (e.g. "e2e:remote")

jobs:
  e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v7

      - name: 🟩 Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run E2E tests
        run: npm run ${{ inputs.e2e-command }}
        env:
          BASE_URL: ${{ inputs.base-url }}
