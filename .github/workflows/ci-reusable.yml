name: 🛡️ CI Quality Gate (Reusable)

on:
  workflow_call:
    inputs:
      php-version-primary:
        description: 'Primary PHP version (coverage + sonar)'
        type: string
        required: true
      php-versions-matrix:
        description: 'JSON array of PHP versions for matrix compatibility checks, e.g. ["8.4","8.5"]'
        type: string
        default: '["8.4","8.5","8.6"]'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 🐘 Setup PHP + Composer
        uses: nest-forges/.github/.github/actions/setup-php-composer@main
        with:
          php-version: ${{ inputs.php-version-primary }}

      - name: 🔒 Check for security vulnerabilities
        run: composer audit

  lint:
    name: 🔍 Static Analysis & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: 🐘 Setup PHP + Composer
        uses: nest-forges/.github/.github/actions/setup-php-composer@main
        with:
          php-version: ${{ inputs.php-version-primary }}

      - name: 🔍 Run Static Analysis & Code Quality Checks
        run: |
          composer validate --strict
          composer phpcs
          composer phpstan

  tests-primary:
    name: 🧪 Tests (PHP ${{ inputs.php-version-primary }} + coverage)
    runs-on: ubuntu-latest
    needs: [security, lint]
    steps:
      - name: 🐘 Setup PHP + Composer
        uses: nest-forges/.github/.github/actions/setup-php-composer@main
        with:
          php-version: ${{ inputs.php-version-primary }}
          coverage: xdebug
          ini-values: xdebug.mode=coverage

      - name: 🧪 Run Tests
        env:
          XDEBUG_MODE: coverage
        run: ./vendor/bin/phpunit -c phpunit.xml --display-warnings

      - name: 📤 Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: ./.runtime/coverage.xml
          retention-days: 1

  tests-matrix:
    name: 🧪 Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    needs: [security, lint]
    strategy:
      matrix:
        php-version: ${{ fromJSON(inputs.php-versions-matrix) }}
      fail-fast: false
    steps:
      - name: 🐘 Setup PHP + Composer
        uses: nest-forges/.github/.github/actions/setup-php-composer@main
        with:
          php-version: ${{ matrix.php-version }}

      - name: 🧪 Run Tests
        env:
          XDEBUG_MODE: off
        run: ./vendor/bin/phpunit -c phpunit.xml --display-warnings --no-coverage

  e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: [security, lint]
    steps:
      - name: 🐘 Setup PHP + Composer
        uses: nest-forges/.github/.github/actions/setup-php-composer@main
        with:
          php-version: ${{ inputs.php-version-primary }}

      - name: 📄 Copy .env from example
        run: cp app/configs/env/.example.env app/configs/env/.env

      - name: 🚀 Start PHP built-in server
        run: |
          php -S localhost:8080 ci/router.php &
          until curl -s http://localhost:8080/de > /dev/null; do sleep 0.2; done

      - name: 🟩 Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 📦 Install Node dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run E2E tests
        run: npm run e2e
        env:
          BASE_URL: http://localhost:8080

      - name: 📤 Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  report:
    name: 📊 Coverage & SonarQube
    runs-on: ubuntu-latest
    needs: [tests-primary]
    steps:
      - name: 📊 Coverage Report & SonarQube
        uses: nest-forges/.github/.github/actions/report@main
        with:
          php-version-primary: ${{ inputs.php-version-primary }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
