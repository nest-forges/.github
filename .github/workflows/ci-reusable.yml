name: 🛡️ CI Quality Gate (Reusable)

on:
  workflow_call:
    inputs:
      php-version-primary:
        description: 'Primary PHP version (coverage + sonar)'
        type: string
        default: '8.4'
      php-versions-matrix:
        description: 'JSON array of additional PHP versions for compatibility checks'
        type: string
        default: '["8.5"]'
    secrets:
      GH_PERSONAL_TOKEN:
        required: true
      SONAR_TOKEN:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v7

      - name: 🐘 Set up PHP ${{ inputs.php-version-primary }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version-primary }}
          coverage: none
          tools: composer

      - name: ♻️ Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ inputs.php-version-primary }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ inputs.php-version-primary }}-

      - name: 🛡️ Authenticate Composer with GitHub Token
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
        run: composer config -g github-oauth.github.com $GH_TOKEN

      - name: 📦 Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: 🔒 Check for security vulnerabilities
        run: composer audit

  lint:
    name: 🔍 Static Analysis & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v7

      - name: 🐘 Set up PHP ${{ inputs.php-version-primary }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version-primary }}
          coverage: none
          tools: composer

      - name: ♻️ Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ inputs.php-version-primary }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ inputs.php-version-primary }}-

      - name: 🛡️ Authenticate Composer with GitHub Token
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
        run: composer config -g github-oauth.github.com $GH_TOKEN

      - name: 📦 Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: 🔍 Run Static Analysis & Code Quality Checks
        run: |
          composer phpcs
          composer phpstan

  tests-primary:
    name: 🧪 Tests (PHP ${{ inputs.php-version-primary }} + coverage)
    runs-on: ubuntu-latest
    needs: [security, lint]
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v7

      - name: 🐘 Set up PHP ${{ inputs.php-version-primary }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version-primary }}
          coverage: xdebug
          tools: composer
          ini-values: xdebug.mode=coverage

      - name: ♻️ Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ inputs.php-version-primary }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ inputs.php-version-primary }}-

      - name: 🛡️ Authenticate Composer with GitHub Token
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
        run: composer config -g github-oauth.github.com $GH_TOKEN

      - name: 📦 Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: 🧪 Run Tests
        env:
          XDEBUG_MODE: coverage
        run: ./vendor/bin/phpunit -c phpunit.xml --display-warnings

      - name: 📤 Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: ./.runtime/coverage.xml
          retention-days: 1

  tests-matrix:
    name: 🧪 Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    needs: [security, lint]
    strategy:
      matrix:
        php-version: ${{ fromJSON(inputs.php-versions-matrix) }}
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v7

      - name: 🐘 Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer

      - name: ♻️ Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ matrix.php-version }}-

      - name: 🛡️ Authenticate Composer with GitHub Token
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
        run: composer config -g github-oauth.github.com $GH_TOKEN

      - name: 📦 Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: 🧪 Run Tests
        env:
          XDEBUG_MODE: off
        run: ./vendor/bin/phpunit -c phpunit.xml --display-warnings --no-coverage

  report:
    name: 📊 Coverage & SonarQube
    runs-on: ubuntu-latest
    needs: [tests-primary]
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📥 Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-xml
          path: ./.runtime

      - name: 📊 Comment Coverage Report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const coveragePath = './.runtime/coverage.xml';

            if (!fs.existsSync(coveragePath)) {
              console.log('Coverage file not found');
              return;
            }

            const coverage = fs.readFileSync(coveragePath, 'utf8');
            const matches = [...coverage.matchAll(/statements="(\d+)".*?coveredstatements="(\d+)"/g)];

            if (matches.length > 0) {
              const match = matches[matches.length - 1];
              const total = parseInt(match[1]);
              const covered = parseInt(match[2]);
              const percent = ((covered / total) * 100).toFixed(2);

              const commentBody = `## 📊 Code Coverage Report (PHP ${{ inputs.php-version-primary }})\n\n` +
                `- **Statements Covered:** ${covered} / ${total}\n` +
                `- **Coverage:** ${percent}%\n\n` +
                `${percent >= 80 ? '✅' : percent >= 60 ? '⚠️' : '❌'} ` +
                `${percent >= 80 ? 'Great coverage!' : percent >= 60 ? 'Coverage could be improved' : 'Low coverage - please add more tests'}`;

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const botComment = comments.find(comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes('📊 Code Coverage Report')
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: commentBody
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: commentBody
                });
              }
            }

      - name: 🧩 SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
