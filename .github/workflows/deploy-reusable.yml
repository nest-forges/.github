name: 🚀 Deploy reusable

on:
  workflow_call:
    inputs:
      php-version:
        required: true
        type: string
        description: PHP version to use for the build (e.g. "8.4")
      source-zip:
        required: true
        type: string
        description: Name of the zip file to upload (e.g. "release.zip")
      target:
        required: true
        type: string
        description: Target directory on the server (e.g. "httpdocs/")
      env-path:
        required: true
        type: string
        description: Path inside the unpacked release to place the .env file (e.g. "app/configs/env")
      infisical-secret-path:
        required: true
        type: string
        description: Infisical secret path for project-specific secrets (e.g. "/secret-path")

jobs:
  deploy:
    name: 🚀 Build and deploy release to server
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}

      - name: Fetch secrets from Infisical (/global)
        uses: nest-forges/.github/.github/actions/infisical@main
        with:
          secret-path: /global

      - name: Fetch secrets from Infisical (${{ inputs.infisical-secret-path }})
        uses: nest-forges/.github/.github/actions/infisical@main
        with:
          secret-path: ${{ inputs.infisical-secret-path }}

      - name: 🛡️ Validate required secrets
        run: |
          MISSING=""

          check() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              MISSING="$MISSING\n  ✗ $name"
            fi
          }

          check "GH_PERSONAL_TOKEN" "$GH_PERSONAL_TOKEN"
          check "SSH_HOST"          "$SSH_HOST"
          check "SSH_USERNAME"      "$SSH_USERNAME"
          check "SSH_PASSWORD"      "$SSH_PASSWORD"
          check "ENV_PROD"          "$ENV_PROD"

          if [ -n "$MISSING" ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "❌  Required secrets are missing."
            echo "    Make sure all of the following are"
            echo "    present in Infisical and exported:"
            printf "$MISSING\n"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi

          echo "✅ All required secrets are present."

      - name: Authenticate private packages
        run: composer config --global github-oauth.github.com $GH_PERSONAL_TOKEN

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run composer release
        run: composer release

      - name: Move zip to root
        run: mv release/${{ inputs.source-zip }} ${{ inputs.source-zip }}

      - name: Upload zip to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          password: ${{ env.SSH_PASSWORD }}
          source: ${{ inputs.source-zip }}
          target: ${{ inputs.target }}

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          password: ${{ env.SSH_PASSWORD }}
          envs: ENV_PROD
          script: |
            cd ${{ inputs.target }}

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📁  Recreating temporary directory..."
            rm -rf temporary
            mkdir temporary
            echo "✅ Done"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📦  Unzipping ${{ inputs.source-zip }}..."
            unzip -q ${{ inputs.source-zip }} -d temporary
            RELEASE_DIR=$(ls -d temporary/*/ 2>/dev/null | head -1 | sed 's|temporary/||' | tr -d '/')
            if [ -z "$RELEASE_DIR" ]; then
              echo "❌ Could not detect release directory inside zip"
              exit 1
            fi
            echo "✅ Done → $RELEASE_DIR"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚚  Moving release contents to target..."
            shopt -s dotglob
            mv temporary/* .
            shopt -u dotglob
            echo "✅ Done"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔑  Creating .env from Infisical..."
            mkdir -p "$RELEASE_DIR/${{ inputs.env-path }}"
            printf '%s' "$ENV_PROD" > "$RELEASE_DIR/${{ inputs.env-path }}/.env"
            echo "✅ Done → $RELEASE_DIR/${{ inputs.env-path }}/.env"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🧹  Cleaning up..."
            rm -rf temporary ${{ inputs.source-zip }}
            echo "✅ Done"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀  Deploy complete!"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔍  Verifying deployment..."

            if [ -d "$RELEASE_DIR" ]; then
              echo "✅ Release folder exists: $RELEASE_DIR"
            else
              echo "❌ Release folder not found: $RELEASE_DIR"
            fi

            if [ -f "$RELEASE_DIR/${{ inputs.env-path }}/.env" ]; then
              echo "✅ .env exists at $RELEASE_DIR/${{ inputs.env-path }}"
            else
              echo "❌ .env not found at $RELEASE_DIR/${{ inputs.env-path }}"
            fi

            if [ -f "$RELEASE_DIR/.htaccess" ]; then
              echo "✅ .htaccess exists"
            else
              echo "⚠️  .htaccess not found in $RELEASE_DIR"
            fi

            if [ -d "$RELEASE_DIR/app" ]; then
              echo "✅ app/ directory exists"
            else
              echo "❌ app/ directory not found in $RELEASE_DIR"
            fi

            if [ ! -f "${{ inputs.source-zip }}" ]; then
              echo "✅ Zip removed"
            else
              echo "❌ Zip still exists"
            fi

            if [ ! -d "temporary" ]; then
              echo "✅ Temporary directory removed"
            else
              echo "❌ Temporary directory still exists"
            fi

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📂  Target contents:"
            ls -la
