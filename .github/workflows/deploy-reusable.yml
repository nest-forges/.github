name: 🚀 Deploy reusable

on:
  workflow_call:
    inputs:
      php-version:
        required: true
        type: string
        description: PHP version to use for the build (e.g. "8.4")
      source-zip:
        required: true
        type: string
        description: Name of the zip file to upload (e.g. "release.zip")
      target:
        required: true
        type: string
        description: Target directory on the server (e.g. "httpdocs/")
      env-path:
        required: true
        type: string
        description: Path inside the unpacked release to place the .env file (e.g. "app/configs/env")
    secrets:
      GH_PERSONAL_TOKEN:
        required: true
        description: GitHub personal access token for authenticating private Composer packages
      SSH_HOST:
        required: true
        description: SSH hostname or IP address of the deployment server
      SSH_USERNAME:
        required: true
        description: SSH username for the deployment server
      SSH_PASSWORD:
        required: true
        description: SSH password for the deployment server

jobs:
  deploy:
    name: 🚀 Build and deploy release to server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}

      - name: Authenticate private packages
        run: composer config --global github-oauth.github.com ${{ secrets.GH_PERSONAL_TOKEN }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run composer release
        run: composer release

      - name: Move zip to root
        run: mv release/${{ inputs.source-zip }} ${{ inputs.source-zip }}

      - name: Upload zip to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ${{ inputs.source-zip }}
          target: ${{ inputs.target }}

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ${{ inputs.target }}

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📁  Recreating temporary directory..."
            rm -rf temporary
            mkdir temporary
            echo "✅ Done"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📦  Unzipping ${{ inputs.source-zip }}..."
            unzip -q ${{ inputs.source-zip }} -d temporary
            RELEASE_DIR=$(ls -d temporary/*/ | head -1 | sed 's|temporary/||' | tr -d '/')
            echo "✅ Done → $RELEASE_DIR"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔑  Copying .env..."
            cp shared/.env temporary/*/${{ inputs.env-path }}
            echo "✅ Done → temporary/*/${{ inputs.env-path }}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚚  Moving release contents to target..."
            mv temporary/* . 2>/dev/null || true
            mv temporary/.* . 2>/dev/null || true
            echo "✅ Done"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🧹  Cleaning up..."
            rm -rf temporary ${{ inputs.source-zip }}
            echo "✅ Done"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀  Deploy complete!"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔍  Verifying deployment..."

            if [ -d "$RELEASE_DIR" ]; then
              echo "✅ Release folder exists: $RELEASE_DIR"
            else
              echo "❌ Release folder not found: $RELEASE_DIR"
            fi

            if [ -f "$RELEASE_DIR/${{ inputs.env-path }}/.env" ]; then
              echo "✅ .env exists at $RELEASE_DIR/${{ inputs.env-path }}"
            else
              echo "❌ .env not found at $RELEASE_DIR/${{ inputs.env-path }}"
            fi

            if [ -f "$RELEASE_DIR/.htaccess" ]; then
              echo "✅ .htaccess exists"
            else
              echo "⚠️  .htaccess not found in $RELEASE_DIR"
            fi

            if [ -d "$RELEASE_DIR/app" ]; then
              echo "✅ app/ directory exists"
            else
              echo "❌ app/ directory not found in $RELEASE_DIR"
            fi

            if [ ! -f "${{ inputs.source-zip }}" ]; then
              echo "✅ Zip removed"
            else
              echo "❌ Zip still exists"
            fi

            if [ ! -d "temporary" ]; then
              echo "✅ Temporary directory removed"
            else
              echo "❌ Temporary directory still exists"
            fi

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📂  Target contents:"
            ls -la
